[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrosynthesis-explorer"
version = "0.1.0"
description = "A local route explorer powered by AiZynthFinder"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "rdkit>=2023.9,<2024", "Pillow>=12,<13", "PyYAML>=6,<7", "requests>=2.32,<3", "xgboost==2.1.4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["explorer*"]

[tool.setuptools.package-data]
explorer = ["static/*", "assets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
